services:
  backend:
    build: ./backend
    container_name: keycloak-flow-designer-api
    restart: unless-stopped
    env_file: .env
    volumes:
      - designer_data:/app/data
    expose: ["8000"]
    networks: [designer]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
  frontend:
    build:
      context: ./frontend
      args: { VITE_API_URL: /api }
    container_name: keycloak-flow-designer-web
    restart: unless-stopped
    ports: ["8088:80"]
    depends_on:
      backend:
        condition: service_healthy
    networks: [designer]
    security_opt: ["no-new-privileges:true"]

volumes:
  designer_data:
networks:
  designer:
    driver: bridge
